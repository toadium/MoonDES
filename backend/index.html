<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoonDES — 离散事件仿真平台</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; }
    .header { background: #16213e; padding: 20px; text-align: center; border-bottom: 2px solid #0f3460; }
    .header h1 { color: #e94560; font-size: 24px; }
    .header p { color: #888; font-size: 14px; margin-top: 4px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; display: flex; gap: 20px; }
    .sidebar { width: 280px; flex-shrink: 0; }
    .sidebar h2 { font-size: 16px; margin-bottom: 10px; color: #e94560; }
    .example-list { display: flex; flex-direction: column; gap: 6px; }
    .example-item { padding: 10px 12px; background: #16213e; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
    .example-item:hover { border-color: #e94560; }
    .example-item.active { border-color: #e94560; background: #0f3460; }
    .example-item .title { font-weight: 600; font-size: 14px; }
    .example-item .cat { font-size: 11px; color: #888; margin-top: 2px; }
    .main { flex: 1; }
    .main h2 { font-size: 18px; margin-bottom: 10px; color: #e94560; }
    .main h3 { font-size: 15px; margin-bottom: 8px; color: #e94560; }
    .main .desc { font-size: 13px; color: #aaa; margin-bottom: 16px; }
    .btn-run { padding: 10px 24px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-run:hover { background: #c81e45; }
    .btn-run:disabled { background: #555; cursor: not-allowed; }

    /* 可视化区域 */
    .visual-area { margin-top: 16px; }
    .loading-spinner { text-align: center; padding: 40px; color: #e94560; }

    /* 统计卡片网格 */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .stat-card { padding: 16px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.1); }
    .stat-card .stat-label { font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 22px; font-weight: 700; }
    .stat-blue { background: linear-gradient(135deg, #1565c0, #0d47a1); }
    .stat-green { background: linear-gradient(135deg, #2e7d32, #1b5e20); }
    .stat-orange { background: linear-gradient(135deg, #ef6c00, #e65100); }
    .stat-red { background: linear-gradient(135deg, #c62828, #b71c1c); }
    .stat-purple { background: linear-gradient(135deg, #6a1b9a, #4a148c); }
    .stat-cyan { background: linear-gradient(135deg, #00838f, #006064); }
    .stat-blue .stat-value, .stat-green .stat-value, .stat-orange .stat-value,
    .stat-red .stat-value, .stat-purple .stat-value, .stat-cyan .stat-value { color: #fff; }
    .stat-blue .stat-label, .stat-green .stat-label, .stat-orange .stat-label,
    .stat-red .stat-label, .stat-purple .stat-label, .stat-cyan .stat-label { color: rgba(255,255,255,0.7); }

    /* Mermaid 图表区域 */
    .mermaid-section { margin-bottom: 20px; background: #16213e; border-radius: 8px; padding: 20px; border: 1px solid #30363d; }
    .mermaid { display: flex; justify-content: center; padding: 10px; }
    .mermaid svg { max-width: 100%; height: auto; }

    /* 输出区域 */
    .output-section { }
    .output { background: #0d1117; border-radius: 8px; padding: 16px; font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; max-height: 600px; overflow-y: auto; border: 1px solid #30363d; }
    .output.placeholder { color: #555; text-align: center; padding: 40px; }
    .output.error-output { border-color: #e94560; color: #e94560; }
    .status { margin-top: 8px; font-size: 12px; color: #888; }
    .status.error { color: #e94560; }
    .status.success { color: #4caf50; }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <h1>MoonDES — 离散事件仿真平台</h1>
    <p>21 层 · 456 测试 · 19 示例 · Proton + Rabbita 全栈 · Mermaid 可视化</p>
  </div>
  <div id="app"></div>
  <script src="/frontend.js"></script>
  <script>
    // 初始化 Mermaid
    if (typeof mermaid !== 'undefined') {
      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        themeVariables: {
          darkMode: true,
          background: '#16213e',
          primaryColor: '#0f3460',
          primaryTextColor: '#e0e0e0',
          primaryBorderColor: '#e94560',
          lineColor: '#888',
          secondaryColor: '#1a1a2e',
          tertiaryColor: '#16213e'
        },
        flowchart: { curve: 'basis', padding: 20 },
        stateDiagram: { useMaxWidth: true }
      });
    }

    // MutationObserver: 当 .mermaid div 被添加时自动渲染
    let mermaidCounter = 0;
    const observer = new MutationObserver((mutations) => {
      for (const mutation of mutations) {
        for (const node of mutation.addedNodes) {
          if (node.nodeType === 1) {
            const mermaidDivs = node.classList && node.classList.contains('mermaid')
              ? [node]
              : node.querySelectorAll ? node.querySelectorAll('.mermaid') : [];
            for (const div of mermaidDivs) {
              if (div.getAttribute('data-processed') !== 'true' && div.textContent.trim()) {
                div.setAttribute('data-processed', 'true');
                const id = 'mermaid-' + (++mermaidCounter);
                const code = div.textContent.trim();
                try {
                  mermaid.render(id, code).then(({ svg }) => {
                    div.innerHTML = svg;
                  }).catch(err => {
                    console.warn('Mermaid render error:', err);
                  });
                } catch (e) {
                  console.warn('Mermaid render exception:', e);
                }
              }
            }
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>
</body>
</html>
