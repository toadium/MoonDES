<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoonDES — 离散事件仿真平台</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f0f1a; color: #d0d0e0; }
    .header { background: linear-gradient(135deg,#0a0a1a,#111127); padding: 16px 24px; border-bottom: 1px solid #1e1e3a; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 22px; font-weight: 800; color: #00d4ff; }
    .header-sub { font-size: 13px; color: #666; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .header-stat { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #888; }
    .header-stat .stat-num { color: #00d4ff; font-weight: 700; font-size: 15px; }
    .header-tag { padding: 3px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #1a1a3e; color: #7c7caa; border: 1px solid #2a2a4e; }
    .container { max-width: 1280px; margin: 0 auto; padding: 20px; display: flex; gap: 20px; }
    .sidebar { width: 260px; flex-shrink: 0; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; }
    .sidebar-header h2 { font-size: 14px; color: #00d4ff; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .sidebar-count { font-size: 12px; color: #555; background: #1a1a3e; padding: 2px 8px; border-radius: 10px; }
    .example-list { display: flex; flex-direction: column; gap: 2px; }
    .group-header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer; border-radius: 6px; transition: background 0.15s; user-select: none; }
    .group-header:hover { background: #15152e; }
    .group-header.collapsed { margin-bottom: 0; }
    .group-icon { font-size: 14px; } .group-name { font-size: 13px; font-weight: 600; color: #b0b0cc; flex: 1; }
    .group-count { font-size: 11px; color: #555; background: #1a1a3e; padding: 1px 7px; border-radius: 8px; }
    .group-arrow { font-size: 9px; color: #555; }
    .group-items { display: flex; flex-direction: column; gap: 3px; padding: 4px 0 8px 12px; border-left: 2px solid #1e1e3a; margin-left: 10px; }
    .example-item { padding: 8px 12px; background: #111127; border-radius: 5px; cursor: pointer; border-left: 3px solid transparent; transition: all 0.15s; }
    .example-item:hover { background: #15152e; border-left-color: #333; }
    .example-item.active { background: #0d1b2a; border-left-color: #00d4ff; }
    .example-item.active .title { color: #00d4ff; }
    .example-item .title { font-weight: 600; font-size: 13px; color: #c0c0d8; }
    .main { flex: 1; min-width: 0; }
    .main-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .main-header h2 { font-size: 20px; font-weight: 700; color: #fff; }
    .main-category { font-size: 12px; color: #00d4ff; background: rgba(0,212,255,0.1); padding: 3px 10px; border-radius: 12px; border: 1px solid rgba(0,212,255,0.2); }
    .info-section { margin: 12px 0; background: #111127; border-radius: 8px; border: 1px solid #1e1e3a; overflow: hidden; }
    .info-section.expanded .info-body { display: block; }
    .info-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; cursor: pointer; user-select: none; }
    .info-header:hover { background: #15152e; }
    .info-icon { font-size: 14px; }
    .info-header > span:nth-child(2) { font-size: 13px; font-weight: 600; color: #b0b0cc; flex: 1; }
    .info-toggle { font-size: 11px; color: #555; cursor: pointer; }
    .info-body { display: none; padding: 0 14px 12px; }
    .info-body p { font-size: 13px; color: #888; line-height: 1.6; }
    .action-bar { margin: 12px 0 16px; }
    .btn-run { padding: 10px 28px; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.2s; }
    .btn-idle { background: linear-gradient(135deg,#006d80,#004d5c); }
    .btn-idle:hover { background: linear-gradient(135deg,#008ba0,#006d80); box-shadow: 0 0 12px rgba(0,212,255,0.3); }
    .btn-running { background: linear-gradient(135deg,#b8860b,#8b6914); cursor: wait; }
    .btn-completed { background: linear-gradient(135deg,#2e7d32,#1b5e20); }
    .btn-completed:hover { background: linear-gradient(135deg,#388e3c,#2e7d32); box-shadow: 0 0 12px rgba(76,175,80,0.3); }
    .visual-area { }
    .loading-spinner { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 48px; color: #00d4ff; font-size: 14px; }
    .spinner { width: 20px; height: 20px; border: 2px solid #1e1e3a; border-top-color: #00d4ff; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(150px,1fr)); gap: 10px; margin-bottom: 16px; }
    .stat-card { padding: 14px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.06); }
    .stat-card .stat-label { font-size: 11px; color: rgba(255,255,255,0.6); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .stat-value { font-size: 20px; font-weight: 700; color: #fff; }
    .stat-blue { background: linear-gradient(135deg,#1565c0,#0d47a1); }
    .stat-green { background: linear-gradient(135deg,#2e7d32,#1b5e20); }
    .stat-orange { background: linear-gradient(135deg,#ef6c00,#e65100); }
    .stat-red { background: linear-gradient(135deg,#c62828,#b71c1c); }
    .stat-purple { background: linear-gradient(135deg,#6a1b9a,#4a148c); }
    .stat-cyan { background: linear-gradient(135deg,#00838f,#006064); }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .section-header h3 { font-size: 14px; font-weight: 600; color: #8888aa; text-transform: uppercase; letter-spacing: 0.8px; }
    .mermaid-section { margin-bottom: 16px; background: #111127; border-radius: 8px; padding: 16px; border: 1px solid #1e1e3a; }
    .mermaid { display: flex; justify-content: center; padding: 8px; overflow-x: auto; }
    .mermaid svg { max-width: 100%; height: auto; }
    .tool-btn { padding: 4px 12px; font-size: 12px; color: #888; background: #1a1a3e; border: 1px solid #2a2a4e; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
    .tool-btn:hover { color: #00d4ff; border-color: #00d4ff; }
    .output-section { } .toolbar-buttons { display: flex; gap: 6px; }
    .output { background: #0a0a14; border-radius: 8px; padding: 14px; font-family: 'Fira Code','Consolas',monospace; font-size: 13px; line-height: 1.6; white-space: pre-wrap; max-height: 500px; overflow-y: auto; border: 1px solid #1e1e3a; color: #c0c0d8; }
    .output.placeholder { color: #444; text-align: center; padding: 48px; background: #111127; }
    .output.error-output { border-color: #ff6b6b; color: #ff6b6b; }
    @keyframes anim-glow-cyan { 0%,100% { filter: drop-shadow(0 0 2px rgba(0,212,255,0.3)); } 50% { filter: drop-shadow(0 0 10px rgba(0,212,255,0.9)); } }
    @keyframes anim-glow-orange { 0%,100% { filter: drop-shadow(0 0 2px rgba(239,108,0,0.3)); } 50% { filter: drop-shadow(0 0 10px rgba(239,108,0,0.9)); } }
    @keyframes anim-glow-green { 0%,100% { filter: drop-shadow(0 0 2px rgba(76,175,80,0.3)); } 50% { filter: drop-shadow(0 0 10px rgba(76,175,80,0.9)); } }
    @keyframes anim-glow-purple { 0%,100% { filter: drop-shadow(0 0 2px rgba(156,39,176,0.3)); } 50% { filter: drop-shadow(0 0 10px rgba(156,39,176,0.9)); } }
    .anim-node { opacity: 0.5; transition: opacity 0.4s; }
    .anim-node.anim-active { opacity: 1; animation: anim-glow-cyan 1.8s ease-in-out infinite; }
    .anim-node.anim-active-orange { opacity: 1; animation: anim-glow-orange 1.8s ease-in-out infinite; }
    .anim-node.anim-active-green { opacity: 1; animation: anim-glow-green 1.8s ease-in-out infinite; }
    .anim-node.anim-active-purple { opacity: 1; animation: anim-glow-purple 1.8s ease-in-out infinite; }
    @keyframes anim-flow { 0% { stroke-dashoffset: var(--flow-len,200); opacity: 0.3; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0.6; } }
    .anim-edge { stroke-dasharray: var(--flow-len,200); stroke-dashoffset: var(--flow-len,200); animation: anim-flow var(--flow-dur,2s) ease-in-out var(--flow-delay,0s) forwards; }
    .anim-edge-glow { stroke: #00d4ff !important; stroke-width: 2.5 !important; }
    @keyframes anim-tl-pulse { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    .anim-tl-event { animation: anim-tl-pulse 0.6s ease-out var(--flow-delay,0s) both; transform-origin: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left"><span class="header-logo">MoonDES</span><span class="header-sub">离散事件仿真平台</span></div>
    <div class="header-right">
      <div class="header-stat"><span class="stat-num">19</span><span>示例</span></div>
      <div class="header-stat"><span class="stat-num">456</span><span>测试</span></div>
      <span class="header-tag">Proton</span><span class="header-tag">Rabbita</span><span class="header-tag">Mermaid</span>
    </div>
  </div>
  <div id="app"></div>
  <script src="/frontend.js"></script>
  <script src="/anim.js"></script>
</body>
</html>
