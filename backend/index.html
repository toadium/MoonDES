<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoonDES — 离散事件仿真平台</title>

  <style>

*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s}.header{background:var(--bg-grad);padding:16px 24px;border-bottom:2px solid var(--accent);display:flex;align-items:center;justify-content:space-between;transition:all .3s}.header-left{display:flex;align-items:center;gap:12px}.header-logo{font-size:22px;font-weight:800;color:var(--accent);text-shadow:0 0 20px var(--accent-soft)}.header-sub{font-size:13px;color:var(--text-muted)}.header-right{display:flex;align-items:center;gap:16px}.header-stat{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted)}.header-stat .stat-num{color:var(--accent);font-weight:700;font-size:15px}.header-tag{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:600;background:var(--tag-bg);color:var(--tag-text);border:1px solid var(--tag-border)}.theme-toggle{width:38px;height:38px;border-radius:50%;border:2px solid var(--border-light);background:var(--surface);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .3s}.theme-toggle:hover{border-color:var(--accent);box-shadow:var(--shadow-glow)}.container{max-width:1280px;margin:0 auto;padding:20px;display:flex;gap:20px}.sidebar{width:260px;flex-shrink:0}.sidebar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:0 4px}.sidebar-header h2{font-size:14px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-weight:700}.sidebar-count{font-size:12px;color:var(--text-dim);background:var(--tag-bg);padding:2px 8px;border-radius:10px}.example-list{display:flex;flex-direction:column;gap:2px}.group-header{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;border-radius:6px;transition:background .15s;user-select:none}.group-header:hover{background:var(--surface-hover)}.group-header.collapsed{margin-bottom:0}.group-icon{font-size:14px}.group-name{font-size:13px;font-weight:600;color:var(--text-muted);flex:1}.group-count{font-size:11px;color:var(--text-dim);background:var(--tag-bg);padding:1px 7px;border-radius:8px}.group-arrow{font-size:9px;color:var(--text-dim)}.group-items{display:flex;flex-direction:column;gap:3px;padding:4px 0 8px 12px;border-left:2px solid var(--border);margin-left:10px}.example-item{padding:8px 12px;background:var(--surface);border-radius:5px;cursor:pointer;border-left:3px solid transparent;transition:all .15s}.example-item:hover{background:var(--surface-hover);border-left-color:var(--border-light)}.example-item.active{background:var(--surface-active);border-left-color:var(--accent)}.example-item.active .title{color:var(--accent)}.example-item .title{font-weight:600;font-size:13px;color:var(--text)}.main{flex:1;min-width:0}.main-header{display:flex;align-items:center;gap:12px;margin-bottom:4px}.main-header h2{font-size:20px;font-weight:700;color:var(--text-bright)}.main-category{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:12px;border:1px solid var(--accent-border)}.info-section{margin:12px 0;background:var(--surface);border-radius:8px;border:1px solid var(--border);overflow:hidden}.info-section.expanded .info-body{display:block}.info-header{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none}.info-header:hover{background:var(--surface-hover)}.info-icon{font-size:14px}.info-header > span:nth-child(2){font-size:13px;font-weight:600;color:var(--text-muted);flex:1}.info-toggle{font-size:11px;color:var(--text-dim);cursor:pointer}.info-body{display:none;padding:0 14px 12px}.info-body p{font-size:13px;color:var(--text-muted);line-height:1.6}.action-bar{margin:12px 0 16px}.btn-run{padding:10px 28px;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}.btn-idle{background:linear-gradient(135deg,var(--btn-idle-1),var(--btn-idle-2))}.btn-idle:hover{box-shadow:var(--shadow-glow);filter:brightness(1.1)}.btn-running{background:linear-gradient(135deg,var(--btn-run-1),var(--btn-run-2));cursor:wait}.btn-completed{background:linear-gradient(135deg,var(--btn-done-1),var(--btn-done-2))}.btn-completed:hover{box-shadow:0 0 12px rgba(76,175,80,0.3);filter:brightness(1.1)}.visual-area{}.loading-spinner{display:flex;align-items:center;justify-content:center;gap:12px;padding:48px;color:var(--accent);font-size:14px}.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}.stat-card{padding:14px;border-radius:8px;text-align:center;border:1px solid rgba(255,255,255,0.06)}.stat-card .stat-label{font-size:11px;color:rgba(255,255,255,0.7);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}.stat-card .stat-value{font-size:20px;font-weight:700;color:#fff}.stat-blue{background:linear-gradient(135deg,var(--stat-blue-1),var(--stat-blue-2))}.stat-green{background:linear-gradient(135deg,var(--stat-green-1),var(--stat-green-2))}.stat-orange{background:linear-gradient(135deg,var(--stat-orange-1),var(--stat-orange-2))}.stat-red{background:linear-gradient(135deg,var(--stat-red-1),var(--stat-red-2))}.stat-purple{background:linear-gradient(135deg,var(--stat-purple-1),var(--stat-purple-2))}.stat-cyan{background:linear-gradient(135deg,var(--stat-cyan-1),var(--stat-cyan-2))}.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.section-header h3{font-size:14px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px}.mermaid-section{margin-bottom:16px;background:var(--surface);border-radius:8px;padding:16px;border:1px solid var(--border)}.mermaid{display:flex;justify-content:center;padding:8px;overflow-x:auto}.mermaid svg{max-width:100%;height:auto}.tool-btn{padding:4px 12px;font-size:12px;color:var(--text-muted);background:var(--tag-bg);border:1px solid var(--tag-border);border-radius:4px;cursor:pointer;transition:all .15s}.tool-btn:hover{color:var(--accent);border-color:var(--accent)}.output-section{}.toolbar-buttons{display:flex;gap:6px}.output{background:var(--output-bg);border-radius:8px;padding:14px;font-family:'Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;white-space:pre-wrap;max-height:500px;overflow-y:auto;border:1px solid var(--border);color:var(--text)}.output.placeholder{color:var(--text-dim);text-align:center;padding:48px;background:var(--surface)}.output.error-output{border-color:#ff6b6b;color:#ff6b6b}
@keyframes anim-glow-cyan{0%,100%{filter:drop-shadow(0 0 2px rgba(var(--accent-rgb),0.3))}50%{filter:drop-shadow(0 0 10px var(--glow-cyan))}}@keyframes anim-glow-orange{0%,100%{filter:drop-shadow(0 0 2px rgba(239,108,0,0.3))}50%{filter:drop-shadow(0 0 10px var(--glow-orange))}}@keyframes anim-glow-green{0%,100%{filter:drop-shadow(0 0 2px rgba(76,175,80,0.3))}50%{filter:drop-shadow(0 0 10px var(--glow-green))}}@keyframes anim-glow-purple{0%,100%{filter:drop-shadow(0 0 2px rgba(156,39,176,0.3))}50%{filter:drop-shadow(0 0 10px var(--glow-purple))}}.anim-node{opacity:0.5;transition:opacity .4s}.anim-node.anim-active{opacity:1;animation:anim-glow-cyan 1.8s ease-in-out infinite}.anim-node.anim-active-orange{opacity:1;animation:anim-glow-orange 1.8s ease-in-out infinite}.anim-node.anim-active-green{opacity:1;animation:anim-glow-green 1.8s ease-in-out infinite}.anim-node.anim-active-purple{opacity:1;animation:anim-glow-purple 1.8s ease-in-out infinite}@keyframes anim-flow{0%{stroke-dashoffset:var(--flow-len,200);opacity:0.3}15%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:0;opacity:0.6}}.anim-edge{stroke-dasharray:var(--flow-len,200);stroke-dashoffset:var(--flow-len,200);animation:anim-flow var(--flow-dur,2s) ease-in-out var(--flow-delay,0s) forwards}.anim-edge-glow{stroke:var(--edge-glow)!important;stroke-width:2.5!important}@keyframes anim-tl-pulse{0%{transform:scale(0.8);opacity:0}50%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}.anim-tl-event{animation:anim-tl-pulse .6s ease-out var(--flow-delay,0s) both;transform-origin:center}
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left"><span class="header-logo">MoonDES</span><span class="header-sub">离散事件仿真平台</span></div>
    <div class="header-right">
      <div class="header-stat"><span class="stat-num">19</span><span>示例</span></div>
      <div class="header-stat"><span class="stat-num">456</span><span>测试</span></div>
      <span class="header-tag">Proton</span><span class="header-tag">Rabbita</span><span class="header-tag">Mermaid</span>
      <button class="theme-toggle" id="theme-toggle" title="切换主题">🌙</button>
    </div>
  </div>
  <div id="app"></div>
  <script src="/frontend.js"></script>
  <script src="/anim.js"></script>
</body>
</html>
